[project]
name = "threshold-api"
version = "0.1.0"
description = "Threshold backend: Ring adapter, ingestion, rhythm and silence watch"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "apscheduler>=3.10,<4",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
    "ring-sandbox[server]>=0.5",
]

[tool.setuptools]
packages = ["ring"]
py-modules = ["config", "db", "models", "ingest", "poller", "webhooks", "routes", "main", "visits", "rhythm", "routine", "watch"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
