[project]
name = "ring-sandbox-synth"
version = "0.1.0"
description = "Generate weeks of realistic Ring event history from a persona, for the ring-sandbox emulator"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "ring-sandbox[server]>=0.5",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ringsynth = "ringsynth.cli:main"

[tool.setuptools.packages.find]
include = ["ringsynth*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
